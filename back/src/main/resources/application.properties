spring.application.name=hub

# Dados locais do usuário, fora do repositório.
spring.datasource.url=jdbc:h2:file:${LOCALAPPDATA:${user.home}/AppData/Local}/Hub/data/hub;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.sql.init.mode=always
server.address=127.0.0.1
hub.google.oauth.client-id=${HUB_GOOGLE_CLIENT_ID:}
hub.video-download.yt-dlp-command=${HUB_VIDEO_DOWNLOAD_YT_DLP_COMMAND:yt-dlp}
hub.media.root=${HUB_MEDIA_ROOT:${LOCALAPPDATA:${user.home}/AppData/Local}/Hub/media}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
