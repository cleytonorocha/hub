spring.application.name=hub

# Banco descartável para desenvolvimento inicial; configure persistência definitiva quando o modelo de domínio existir.
spring.datasource.url=jdbc:h2:mem:hub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
