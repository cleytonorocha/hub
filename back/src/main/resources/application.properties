spring.application.name=hub

# Dados locais do usuário, fora do repositório.
hub.data.root=${HUB_DATA_ROOT:${LOCALAPPDATA:${user.home}/AppData/Local}/Hub}
spring.datasource.url=jdbc:h2:file:${hub.data.root}/database/hub;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.github.cleytonorocha.hub.security.HubTenantIdentifierResolver
spring.h2.console.enabled=false
spring.sql.init.mode=always
server.address=127.0.0.1
hub.google.oauth.client-id=${HUB_GOOGLE_OAUTH_CLIENT_ID:}
hub.google.oauth.client-secret-file=${HUB_GOOGLE_CLIENT_SECRET_FILE:}
hub.google.oauth.credential-key-file=${HUB_GOOGLE_CREDENTIAL_KEY_FILE:}
hub.google.oauth.callback-uri=http://localhost:8081/api/google-tasks/oauth/callback
hub.video-download.yt-dlp-command=${HUB_VIDEO_DOWNLOAD_YT_DLP_COMMAND:yt-dlp}
hub.video-download.node-command=${HUB_VIDEO_DOWNLOAD_NODE_COMMAND:node}
hub.video-download.ffmpeg-command=${HUB_VIDEO_DOWNLOAD_FFMPEG_COMMAND:ffmpeg}
hub.video-download.ffprobe-command=${HUB_VIDEO_DOWNLOAD_FFPROBE_COMMAND:ffprobe}
hub.video-download.temp-root=${HUB_VIDEO_DOWNLOAD_TEMP_ROOT:${java.io.tmpdir}/hub-video-downloads}
hub.media.root=${hub.data.root}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
