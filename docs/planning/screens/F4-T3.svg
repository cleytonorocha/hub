<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F4-T3 — Revisar a conclusão</title><desc id="desc">Existem dois itens abertos. Escolha como deseja continuar. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><rect x="14" y="172" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="205" fill="#a986ff" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#d8c7ff" font-size="15" font-weight="650">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><text x="33" y="391" fill="#aeb1c8" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#aeb1c8" font-size="15" font-weight="400">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F4-T3 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F4  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Revisar a conclusão</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Existem dois itens abertos. Escolha como deseja continuar.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 3 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="384" y="223" width="912" height="629" rx="16" fill="#111527" stroke="#53446d"/><rect x="416" y="255" width="190" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="429" y="276" fill="#f4c781" font-size="13" font-weight="600">2 itens pendentes</text><text x="416" y="336" fill="#f3f1fb" font-size="30" font-weight="700">Concluir mesmo assim?</text><text x="416" y="380" fill="#f3f1fb" font-size="20" font-weight="550">Revisar proposta de projeto</text><text x="416" y="420" fill="#aeb1c8" font-size="17" font-weight="400">A conclusão da tarefa não altera os itens do checklist.</text><rect x="416" y="450" width="848" height="130" rx="10" fill="#1c1928" stroke="#514334"/><rect x="440" y="476" width="22" height="22" rx="6" fill="#0c1020" stroke="#6b6e8c"/><text x="478" y="493" fill="#f3f1fb" font-size="17" font-weight="400">Anotar dúvidas para a reunião</text><rect x="440" y="522" width="22" height="22" rx="6" fill="#0c1020" stroke="#6b6e8c"/><text x="478" y="539" fill="#f3f1fb" font-size="17" font-weight="400">Separar referências de apoio</text><text x="416" y="614" fill="#aeb1c8" font-size="16" font-weight="400">Ao concluir: checklist somente leitura, com progresso de 2 de 4.</text><path d="M416 655h848" stroke="#292c43"/><rect x="416" y="690" width="245" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="434" y="720" fill="#f3f1fb" font-size="15" font-weight="650">Voltar ao checklist</text><rect x="922" y="690" width="310" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="940" y="720" fill="#171025" font-size="15" font-weight="650">Concluir mesmo assim</text><text x="416" y="778" fill="#aeb1c8" font-size="14" font-weight="400">Depois: “Reabrir tarefa” retoma a edição e mantém as marcas anteriores.</text><text x="416" y="808" fill="#aeb1c8" font-size="14" font-weight="400">Cancelar mantém a tarefa pendente e restaura o foco à ação anterior.</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F4-T3</text></g></svg>