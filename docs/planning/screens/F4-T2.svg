<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F4-T2 — Um passo de cada vez</title><desc id="desc">Marque os itens conforme avança, sem concluir a tarefa automaticamente. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><rect x="14" y="172" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="205" fill="#a986ff" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#d8c7ff" font-size="15" font-weight="650">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><text x="33" y="391" fill="#aeb1c8" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#aeb1c8" font-size="15" font-weight="400">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F4-T2 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F4  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Um passo de cada vez</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Marque os itens conforme avança, sem concluir a tarefa automaticamente.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 2 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="222" fill="#f3f1fb" font-size="27" font-weight="650">Revisar proposta de projeto</text><text x="288" y="261" fill="#aeb1c8" font-size="16" font-weight="400">Trabalho · 30 out 2026, 10:00 · Prioridade alta</text><rect x="288" y="300" width="1104" height="369" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="345" fill="#f3f1fb" font-size="22" font-weight="650">Checklist</text><text x="1221" y="345" fill="#84dfbd" font-size="18" font-weight="600">2 de 4</text><rect x="316" y="372" width="1048" height="7" rx="3" fill="#25283d" stroke="#25283d"/><rect x="316" y="372" width="524" height="7" rx="3" fill="#a986ff" stroke="#a986ff"/><rect x="316" y="408" width="22" height="22" rx="6" fill="#a986ff" stroke="#a986ff"/><text x="321" y="425" fill="#171025" font-size="17" font-weight="700">✓</text><text x="354" y="425" fill="#aeb1c8" font-size="17" font-weight="400">Ler os objetivos do projeto</text><path d="M316 446h1048" stroke="#292c43"/><rect x="316" y="465" width="22" height="22" rx="6" fill="#a986ff" stroke="#a986ff"/><text x="321" y="482" fill="#171025" font-size="17" font-weight="700">✓</text><text x="354" y="482" fill="#aeb1c8" font-size="17" font-weight="400">Conferir entregas e prazos</text><path d="M316 503h1048" stroke="#292c43"/><rect x="316" y="522" width="22" height="22" rx="6" fill="#0c1020" stroke="#6b6e8c"/><text x="354" y="539" fill="#f3f1fb" font-size="17" font-weight="400">Anotar dúvidas para a reunião</text><path d="M316 560h1048" stroke="#292c43"/><rect x="316" y="579" width="22" height="22" rx="6" fill="#0c1020" stroke="#6b6e8c"/><text x="354" y="596" fill="#f3f1fb" font-size="17" font-weight="400">Separar referências de apoio</text><text x="316" y="644" fill="#aeb1c8" font-size="14" font-weight="400">Progresso salvo por item.</text><rect x="288" y="703" width="1104" height="83" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="731" fill="#d8c7ff" font-size="15" font-weight="650">A tarefa continua pendente</text><text x="308" y="760" fill="#aeb1c8" font-size="14" font-weight="400">Mesmo com todos os itens marcados, a conclusão da tarefa é uma ação sua.</text><rect x="288" y="829" width="195" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="859" fill="#f3f1fb" font-size="15" font-weight="650">Editar checklist</text><rect x="1163" y="829" width="229" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1181" y="859" fill="#171025" font-size="15" font-weight="650">Concluir tarefa</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F4-T2</text></g></svg>