<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F2-T2 — Importar com segurança</title><desc id="desc">Selecione uma cópia do Hub. Nenhuma alteração acontece nesta etapa. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><text x="33" y="205" fill="#aeb1c8" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#aeb1c8" font-size="15" font-weight="400">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><rect x="14" y="358" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="391" fill="#a986ff" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#d8c7ff" font-size="15" font-weight="650">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F2-T2 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F2  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Importar com segurança</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Selecione uma cópia do Hub. Nenhuma alteração acontece nesta etapa.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 2 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="211" width="1104" height="262" rx="12" fill="#111527" stroke="#5f4a83"/><text x="699" y="271" fill="#a986ff" font-size="36" font-weight="600">↑</text><text x="591" y="317" fill="#f3f1fb" font-size="23" font-weight="650">Escolha seu arquivo de backup</text><text x="543" y="355" fill="#aeb1c8" font-size="16" font-weight="400">Use um arquivo JSON exportado por uma versão compatível do Hub.</text><rect x="695" y="390" width="230" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="713" y="420" fill="#171025" font-size="15" font-weight="650">Selecionar arquivo</text><rect x="288" y="505" width="1104" height="142" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="544" fill="#f3f1fb" font-size="19" font-weight="600">hub-tarefas-2026-10-27.json</text><rect x="1131" y="527" width="229" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1144" y="548" fill="#84dfbd" font-size="13" font-weight="600">Formato reconhecido</text><text x="316" y="582" fill="#aeb1c8" font-size="16" font-weight="400">Cópia de 27 out 2026, 18:20 · 18 tarefas locais · Versão do formato reconhecida</text><text x="316" y="615" fill="#aeb1c8" font-size="14" font-weight="400">JSON do Hub · Limite MVP proposto: 5 MiB e 5.000 tarefas por arquivo.</text><rect x="288" y="676" width="1104" height="83" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="704" fill="#d8c7ff" font-size="15" font-weight="650">Se o arquivo estiver inválido ou incompatível</text><text x="308" y="733" fill="#aeb1c8" font-size="14" font-weight="400">Mostre o motivo e permita escolher outro arquivo. Nada é importado parcialmente.</text><rect x="1187" y="798" width="205" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1205" y="828" fill="#171025" font-size="15" font-weight="650">Revisar importação</text><rect x="288" y="798" width="140" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="828" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F2-T2</text></g></svg>