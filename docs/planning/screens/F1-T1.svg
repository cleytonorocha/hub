<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F1-T1 — Encontre qualquer tarefa</title><desc id="desc">Busca única para tarefas futuras, sem data, pendentes e concluídas. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><rect x="14" y="172" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="205" fill="#a986ff" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#d8c7ff" font-size="15" font-weight="650">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><text x="33" y="391" fill="#aeb1c8" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#aeb1c8" font-size="15" font-weight="400">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F1-T1 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F1  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Encontre qualquer tarefa</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Busca única para tarefas futuras, sem data, pendentes e concluídas.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="204" width="1104" height="184" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="240" fill="#f3f1fb" font-size="18" font-weight="650">Buscar em todas as tarefas</text><rect x="316" y="263" width="1048" height="66" rx="10" fill="#0b1020" stroke="#78619b"/><text x="337" y="304" fill="#a986ff" font-size="30" font-weight="400">⌕</text><text x="381" y="304" fill="#aeb1c8" font-size="18" font-weight="400">Digite um título, categoria ou trecho das observações</text><text x="316" y="360" fill="#aeb1c8" font-size="14" font-weight="400">A busca de Notificações continua disponível no seu contexto atual.</text><text x="288" y="438" fill="#aeb1c8" font-size="12" font-weight="650">18 TAREFAS LOCAIS · COMECE POR UM RECORTE</text><rect x="288" y="459" width="344" height="96" rx="12" fill="#111527" stroke="#292c43"/><text x="308" y="488" fill="#aeb1c8" font-size="14" font-weight="400">Prazo</text><text x="308" y="526" fill="#f3f1fb" font-size="27" font-weight="650">Sem data</text><rect x="668" y="459" width="344" height="96" rx="12" fill="#111527" stroke="#292c43"/><text x="688" y="488" fill="#aeb1c8" font-size="14" font-weight="400">Situação</text><text x="688" y="526" fill="#f3f1fb" font-size="27" font-weight="650">Concluídas</text><rect x="1048" y="459" width="344" height="96" rx="12" fill="#111527" stroke="#292c43"/><text x="1068" y="488" fill="#aeb1c8" font-size="14" font-weight="400">Período</text><text x="1068" y="526" fill="#f3f1fb" font-size="27" font-weight="650">Próximas tarefas</text><rect x="288" y="590" width="1104" height="235" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="628" fill="#f3f1fb" font-size="22" font-weight="650">Tudo no mesmo lugar</text><text x="316" y="668" fill="#aeb1c8" font-size="17" font-weight="400">Encontre a revisão do projeto mesmo que esteja marcada para o mês que vem.</text><text x="316" y="705" fill="#aeb1c8" font-size="17" font-weight="400">Abra os detalhes e volte para os mesmos resultados, sem refazer a busca.</text><rect x="316" y="747" width="150" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="329" y="768" fill="#a986ff" font-size="13" font-weight="600">Todas as datas</text><rect x="480" y="747" width="170" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="493" y="768" fill="#a986ff" font-size="13" font-weight="600">Todos os estados</text><rect x="664" y="747" width="210" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="677" y="768" fill="#a986ff" font-size="13" font-weight="600">Somente tarefas locais</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F1-T1</text></g></svg>