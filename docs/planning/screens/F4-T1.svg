<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F4-T1 — Divida a tarefa em pequenos passos</title><desc id="desc">Um checklist simples para deixar o próximo passo mais claro. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><rect x="14" y="172" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="205" fill="#a986ff" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#d8c7ff" font-size="15" font-weight="650">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><text x="33" y="391" fill="#aeb1c8" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#aeb1c8" font-size="15" font-weight="400">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F4-T1 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F4  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Divida a tarefa em pequenos passos</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Um checklist simples para deixar o próximo passo mais claro.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="221" fill="#f3f1fb" font-size="27" font-weight="650">Revisar proposta de projeto</text><rect x="1184" y="202" width="208" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1197" y="223" fill="#a986ff" font-size="13" font-weight="600">Trabalho</text><rect x="288" y="259" width="1104" height="439" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="302" fill="#f3f1fb" font-size="21" font-weight="650">Checklist · 4 de 20 itens</text><text x="316" y="338" fill="#aeb1c8" font-size="14" font-weight="400">Até 200 caracteres por item. Ordem de criação preservada.</text><text x="316" y="365" fill="#aeb1c8" font-size="14" font-weight="550">Item 1</text><rect x="316" y="377" width="939" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="409" fill="#f3f1fb" font-size="16" font-weight="400">Ler os objetivos do projeto</text><text x="1284" y="408" fill="#aeb1c8" font-size="24" font-weight="400">×</text><text x="316" y="443" fill="#aeb1c8" font-size="14" font-weight="550">Item 2</text><rect x="316" y="455" width="939" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="487" fill="#f3f1fb" font-size="16" font-weight="400">Conferir entregas e prazos</text><text x="1284" y="486" fill="#aeb1c8" font-size="24" font-weight="400">×</text><text x="316" y="521" fill="#aeb1c8" font-size="14" font-weight="550">Item 3</text><rect x="316" y="533" width="939" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="565" fill="#f3f1fb" font-size="16" font-weight="400">Anotar dúvidas para a reunião</text><text x="1284" y="564" fill="#aeb1c8" font-size="24" font-weight="400">×</text><text x="316" y="599" fill="#aeb1c8" font-size="14" font-weight="550">Item 4</text><rect x="316" y="611" width="939" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="643" fill="#f3f1fb" font-size="16" font-weight="400">Separar referências de apoio</text><text x="1284" y="642" fill="#aeb1c8" font-size="24" font-weight="400">×</text><rect x="316" y="719" width="215" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="334" y="749" fill="#f3f1fb" font-size="15" font-weight="650">+ Adicionar etapa</text><text x="316" y="800" fill="#aeb1c8" font-size="15" font-weight="400">Itens vazios precisam ser corrigidos. Remover uma etapa exige confirmação.</text><rect x="1163" y="840" width="229" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1181" y="870" fill="#171025" font-size="15" font-weight="650">Salvar checklist</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F4-T1</text></g></svg>