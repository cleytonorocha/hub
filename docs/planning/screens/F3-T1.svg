<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F3-T1 — Uma rotina que cabe na semana</title><desc id="desc">Crie uma repetição semanal com início e quantidade de ocorrências. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><rect x="14" y="172" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="205" fill="#a986ff" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#d8c7ff" font-size="15" font-weight="650">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><text x="33" y="391" fill="#aeb1c8" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#aeb1c8" font-size="15" font-weight="400">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F3-T1 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F3  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Uma rotina que cabe na semana</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Crie uma repetição semanal com início e quantidade de ocorrências.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="209" width="1104" height="655" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="250" fill="#aeb1c8" font-size="14" font-weight="550">Título da nova tarefa</text><rect x="316" y="262" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="294" fill="#f3f1fb" font-size="16" font-weight="400">Planejar a semana</text><text x="316" y="355" fill="#aeb1c8" font-size="14" font-weight="550">Data inicial obrigatória</text><rect x="316" y="367" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="399" fill="#f3f1fb" font-size="16" font-weight="400">02 nov 2026</text><text x="864" y="355" fill="#aeb1c8" font-size="14" font-weight="550">Horário opcional</text><rect x="864" y="367" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="879" y="399" fill="#f3f1fb" font-size="16" font-weight="400">09:00</text><text x="316" y="466" fill="#aeb1c8" font-size="14" font-weight="550">Repetir</text><rect x="316" y="485" width="171" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="329" y="506" fill="#a986ff" font-size="13" font-weight="600">Toda semana</text><text x="316" y="551" fill="#f3f1fb" font-size="17" font-weight="550">Toda segunda-feira, conforme a data inicial.</text><text x="316" y="586" fill="#aeb1c8" font-size="15" font-weight="400">Cada ocorrência avança 7 dias no calendário local.</text><text x="316" y="655" fill="#aeb1c8" font-size="14" font-weight="550">Quantidade de ocorrências · de 2 a 52</text><rect x="316" y="667" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="699" fill="#f3f1fb" font-size="16" font-weight="400">4</text><text x="864" y="655" fill="#f3f1fb" font-size="16" font-weight="550">Última data calculada: 23 nov 2026</text><text x="864" y="691" fill="#aeb1c8" font-size="15" font-weight="400">Concluir uma não conclui as demais.</text><text x="316" y="756" fill="#aeb1c8" font-size="14" font-weight="400">Checklist em tarefas recorrentes fica fora desta primeira versão.</text><rect x="1113" y="786" width="251" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1131" y="816" fill="#171025" font-size="15" font-weight="650">Revisar 4 ocorrências</text><rect x="316" y="786" width="145" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="334" y="816" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F3-T1</text></g></svg>