TA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F1-T2 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F1  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Resultados da busca</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Refine o que precisa e mantenha o contexto ao abrir uma tarefa.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 2 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="215" fill="#aeb1c8" font-size="14" font-weight="550">Busca</text><rect x="288" y="227" width="1104" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="303" y="259" fill="#f3f1fb" font-size="16" font-weight="400">planejamento</text><rect x="288" y="298" width="145" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="319" fill="#a986ff" font-size="13" font-weight="600">Pendente ×</text><rect x="445" y="298" width="145" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="458" y="319" fill="#a986ff" font-size="13" font-weight="600">Trabalho ×</text><text x="1260" y="320" fill="#a986ff" font-size="14" font-weight="400">Limpar filtros</text><text x="288" y="379" fill="#f3f1fb" font-size="22" font-weight="650">2 tarefas encontradas</text><rect x="288" y="406" width="726" height="92" rx="10" fill="#111527" stroke="#292c43"/><rect x="308" y="432" width="22" height="22" rx="6" fill="#0b1020" stroke="#5f5c7c"/><text x="347" y="440" fill="#f3f1fb" font-size="18" font-weight="550">Revisar planejamento de projeto</text><text x="347" y="470" fill="#aeb1c8" font-size="14" font-weight="400">Trabalho · 30 out 2026, 10:00 · Alta</text><rect x="869" y="433" width="125" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="882" y="454" fill="#d8c7ff" font-siz