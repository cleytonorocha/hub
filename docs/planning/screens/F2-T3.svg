<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F2-T3 — Confira antes de adicionar</title><desc id="desc">14 novas tarefas, 4 idênticas e nenhum conflito: seus dados atuais são preservados. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><text x="33" y="205" fill="#aeb1c8" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#aeb1c8" font-size="15" font-weight="400">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><rect x="14" y="358" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="391" fill="#a986ff" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#d8c7ff" font-size="15" font-weight="650">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F2-T3 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F2  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Confira antes de adicionar</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">14 novas tarefas, 4 idênticas e nenhum conflito: seus dados atuais são preservados.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 3 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="210" width="344" height="96" rx="12" fill="#111527" stroke="#292c43"/><text x="308" y="239" fill="#aeb1c8" font-size="14" font-weight="400">Novas tarefas</text><text x="308" y="277" fill="#f3f1fb" font-size="27" font-weight="650">14</text><rect x="668" y="210" width="344" height="96" rx="12" fill="#111527" stroke="#292c43"/><text x="688" y="239" fill="#aeb1c8" font-size="14" font-weight="400">Idênticas / ignoradas</text><text x="688" y="277" fill="#f3f1fb" font-size="27" font-weight="650">4</text><rect x="1048" y="210" width="344" height="96" rx="12" fill="#111527" stroke="#292c43"/><text x="1068" y="239" fill="#aeb1c8" font-size="14" font-weight="400">Conflitantes / bloqueios</text><text x="1068" y="277" fill="#f3f1fb" font-size="27" font-weight="650">0</text><rect x="288" y="339" width="1104" height="255" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="379" fill="#f3f1fb" font-size="20" font-weight="650">O que será adicionado</text><text x="316" y="421" fill="#f3f1fb" font-size="18" font-weight="400">Revisar proposta de projeto</text><text x="316" y="452" fill="#aeb1c8" font-size="14" font-weight="400">Trabalho · 30 out 2026, 10:00</text><path d="M316 471h1048" stroke="#292c43"/><text x="316" y="510" fill="#f3f1fb" font-size="18" font-weight="400">Planejar as compras da semana</text><text x="316" y="541" fill="#aeb1c8" font-size="14" font-weight="400">Pessoal · 31 out 2026, sem horário</text><text x="316" y="575" fill="#a986ff" font-size="14" font-weight="400">+ 12 outras tarefas novas</text><text x="288" y="640" fill="#f4c781" font-size="17" font-weight="600">Mesmo ID e conteúdo diferente? A importação inteira fica bloqueada.</text><text x="288" y="674" fill="#aeb1c8" font-size="15" font-weight="400">Nenhuma tarefa é adicionada até resolver os conflitos e revisar uma nova prévia.</text><rect x="288" y="705" width="1104" height="83" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="733" fill="#d8c7ff" font-size="15" font-weight="650">Tudo ou nada: 18 registros revisados nesta cópia</text><text x="308" y="762" fill="#aeb1c8" font-size="14" font-weight="400">Dados locais mudaram? Revalide e peça nova revisão. Preferências não fazem parte da cópia.</text><rect x="288" y="823" width="140" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="853" fill="#f3f1fb" font-size="15" font-weight="650">Voltar</text><rect x="1130" y="823" width="262" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1148" y="853" fill="#171025" font-size="15" font-weight="650">Adicionar 14 tarefas</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F2-T3</text></g></svg>