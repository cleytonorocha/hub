<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F2-T1 — Cópia das suas tarefas</title><desc id="desc">Crie uma cópia portátil das tarefas locais. Preferências não estão incluídas. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><text x="33" y="205" fill="#aeb1c8" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#aeb1c8" font-size="15" font-weight="400">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><rect x="14" y="358" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="391" fill="#a986ff" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#d8c7ff" font-size="15" font-weight="650">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F2-T1 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F2  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Cópia das suas tarefas</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Crie uma cópia portátil das tarefas locais. Preferências não estão incluídas.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="204" width="220" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="225" fill="#a986ff" font-size="13" font-weight="600">Configurações / Dados</text><text x="288" y="283" fill="#f3f1fb" font-size="27" font-weight="650">Exportar uma cópia das tarefas</text><text x="288" y="320" fill="#aeb1c8" font-size="17" font-weight="400">18 tarefas locais · Inclui concluídas e sem data.</text><rect x="288" y="359" width="1104" height="270" rx="12" fill="#111527" stroke="#292c43"/><rect x="318" y="390" width="22" height="22" rx="6" fill="#a986ff" stroke="#a986ff"/><text x="323" y="407" fill="#171025" font-size="17" font-weight="700">✓</text><text x="356" y="407" fill="#f3f1fb" font-size="17" font-weight="400">Títulos, datas, horários, categorias, prioridade, cor e observações</text><rect x="318" y="438" width="22" height="22" rx="6" fill="#a986ff" stroke="#a986ff"/><text x="323" y="455" fill="#171025" font-size="17" font-weight="700">✓</text><text x="356" y="455" fill="#f3f1fb" font-size="17" font-weight="400">Identificadores, estado de conclusão e versão do formato</text><path d="M318 487h1044" stroke="#292c43"/><text x="318" y="526" fill="#aeb1c8" font-size="16" font-weight="400">Não inclui preferências do navegador, credenciais, downloads nem o banco H2.</text><text x="318" y="569" fill="#f4c781" font-size="16" font-weight="400">O arquivo contém textos pessoais. Guarde-o em um local privado.</text><rect x="288" y="661" width="205" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="306" y="691" fill="#171025" font-size="15" font-weight="650">Exportar cópia</text><rect x="513" y="661" width="218" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="531" y="691" fill="#f3f1fb" font-size="15" font-weight="650">Importar uma cópia</text><rect x="288" y="754" width="1104" height="83" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="782" fill="#d8c7ff" font-size="15" font-weight="650">Quando estiver pronto: arquivo preparado para salvar</text><text x="308" y="811" fill="#aeb1c8" font-size="14" font-weight="400">Exiba data e hora da cópia; não afirme que o navegador confirmou a gravação no dispositivo.</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F2-T1</text></g></svg>