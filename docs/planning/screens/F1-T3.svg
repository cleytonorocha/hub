<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">F1-T3 — Uma tarefa, com todo o contexto</title><desc id="desc">Ao voltar, termo, filtros e posição dos resultados são preservados. Proposta estática; todos os dados são exemplos.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="32" y="61" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="74" y="60" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="33" y="143" fill="#aeb1c8" font-size="22" font-weight="400">⌂</text><text x="69" y="141" fill="#aeb1c8" font-size="15" font-weight="400">Visão Geral</text><rect x="14" y="172" width="216" height="52" rx="10" fill="#211b37" stroke="#453261"/><text x="33" y="205" fill="#a986ff" font-size="22" font-weight="400">▦</text><text x="69" y="203" fill="#d8c7ff" font-size="15" font-weight="650">Calendário</text><text x="33" y="267" fill="#aeb1c8" font-size="22" font-weight="400">♧</text><text x="69" y="265" fill="#aeb1c8" font-size="15" font-weight="400">Notificações</text><text x="33" y="329" fill="#aeb1c8" font-size="22" font-weight="400">◇</text><text x="69" y="327" fill="#aeb1c8" font-size="15" font-weight="400">Ferramentas</text><text x="33" y="391" fill="#aeb1c8" font-size="22" font-weight="400">☷</text><text x="69" y="389" fill="#aeb1c8" font-size="15" font-weight="400">Configurações</text><path d="M25 500h194" stroke="#292c43"/><text x="28" y="534" fill="#aeb1c8" font-size="11" font-weight="650">ESPAÇO PESSOAL</text><text x="28" y="563" fill="#f3f1fb" font-size="14" font-weight="400">Tarefas locais</text><text x="28" y="590" fill="#aeb1c8" font-size="12" font-weight="400">Seus dados neste dispositivo</text><text x="28" y="931" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA DE DESIGN</text><text x="28" y="955" fill="#aeb1c8" font-size="12" font-weight="400">F1-T3 · Dados de exemplo</text><text x="288" y="50" fill="#a986ff" font-size="12" font-weight="650">F1  /  PLANEJAMENTO DE FEATURES</text><text x="288" y="103" fill="#f3f1fb" font-size="32" font-weight="700">Uma tarefa, com todo o contexto</text><text x="288" y="137" fill="#aeb1c8" font-size="16" font-weight="400">Ao voltar, termo, filtros e posição dos resultados são preservados.</text><rect x="1216" y="72" width="158" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1229" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 3 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="214" fill="#a986ff" font-size="16" font-weight="600">‹ Voltar aos 2 resultados de “planejamento”</text><rect x="288" y="244" width="726" height="585" rx="12" fill="#111527" stroke="#292c43"/><rect x="316" y="274" width="113" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="329" y="295" fill="#a986ff" font-size="13" font-weight="600">Trabalho</text><rect x="440" y="274" width="155" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="453" y="295" fill="#f4c781" font-size="13" font-weight="600">Prioridade alta</text><text x="316" y="361" fill="#f3f1fb" font-size="27" font-weight="650">Revisar planejamento de projeto</text><text x="316" y="406" fill="#aeb1c8" font-size="14" font-weight="550">Data</text><rect x="316" y="418" width="315" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="450" fill="#f3f1fb" font-size="16" font-weight="400">30 out 2026</text><text x="658" y="406" fill="#aeb1c8" font-size="14" font-weight="550">Horário</text><rect x="658" y="418" width="326" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="673" y="450" fill="#f3f1fb" font-size="16" font-weight="400">10:00</text><text x="316" y="520" fill="#aeb1c8" font-size="14" font-weight="550">Observações</text><text x="316" y="559" fill="#f3f1fb" font-size="18" font-weight="400">Conferir escopo e preparar comentários</text><text x="316" y="590" fill="#f3f1fb" font-size="18" font-weight="400">para a próxima conversa de planejamento.</text><path d="M316 637h668" stroke="#292c43"/><rect x="316" y="668" width="22" height="22" rx="6" fill="#0c1020" stroke="#6b6e8c"/><text x="354" y="685" fill="#f3f1fb" font-size="17" font-weight="400">Marcar como concluída</text><rect x="316" y="743" width="190" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="334" y="773" fill="#171025" font-size="15" font-weight="650">Salvar alterações</text><text x="749" y="775" fill="#a986ff" font-size="16" font-weight="600">Abrir no calendário ›</text><rect x="1038" y="244" width="354" height="270" rx="12" fill="#111527" stroke="#292c43"/><text x="1062" y="284" fill="#f3f1fb" font-size="18" font-weight="650">Sua busca continua aqui</text><text x="1062" y="326" fill="#aeb1c8" font-size="16" font-weight="400">Termo: planejamento</text><text x="1062" y="363" fill="#aeb1c8" font-size="16" font-weight="400">Situação: pendentes</text><text x="1062" y="400" fill="#aeb1c8" font-size="16" font-weight="400">Prazo: todas as datas</text><text x="1062" y="437" fill="#aeb1c8" font-size="16" font-weight="400">Categoria: Trabalho</text><text x="1062" y="478" fill="#a986ff" font-size="15" font-weight="600">2 resultados</text><rect x="1038" y="544" width="354" height="83" rx="10" fill="#19182d" stroke="#3c3459"/><text x="1058" y="572" fill="#d8c7ff" font-size="15" font-weight="650">Se houver erro ao salvar</text><text x="1058" y="601" fill="#aeb1c8" font-size="14" font-weight="400">Mantenha os campos para tentar de novo.</text><path d="M288 928h1104" stroke="#292c43"/><text x="288" y="959" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • proposta para discussão • não representa funcionalidade entregue</text><text x="1277" y="959" fill="#a986ff" font-size="13" font-weight="600">F1-T3</text></g></svg>