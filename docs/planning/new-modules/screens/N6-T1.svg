<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N6-T1 — O importante, antes de vencer</title><desc id="desc">Um catálogo local de documentos e datas que merecem atenção. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><rect x="14" y="426" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="458" fill="#a986ff" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#d8c7ff" font-size="13" font-weight="650">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N6-T1 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N6 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">O importante, antes de vencer</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Um catálogo local de documentos e datas que merecem atenção.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="1105" y="204" width="287" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1123" y="234" fill="#171025" font-size="15" font-weight="650">+ Registrar documento</text><rect x="288" y="204" width="344" height="98" rx="12" fill="#111527" stroke="#292c43"/><text x="308" y="233" fill="#aeb1c8" font-size="14" font-weight="400">Vencem em até 30 dias</text><text x="308" y="273" fill="#f4c781" font-size="28" font-weight="650">2 documentos</text><rect x="668" y="204" width="344" height="98" rx="12" fill="#111527" stroke="#292c43"/><text x="688" y="233" fill="#aeb1c8" font-size="14" font-weight="400">Sem data de validade</text><text x="688" y="273" fill="#f3f1fb" font-size="28" font-weight="650">1 documento</text><text x="288" y="339" fill="#aeb1c8" font-size="14" font-weight="550">Buscar no catálogo</text><rect x="288" y="351" width="1104" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="303" y="383" fill="#f3f1fb" font-size="16" font-weight="400">Nome ou categoria</text><rect x="288" y="443" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="476" fill="#f3f1fb" font-size="18" font-weight="600">Seguro residencial</text><text x="310" y="506" fill="#aeb1c8" font-size="14" font-weight="400">Validade: 15 nov 2026 · Categoria: Casa</text><rect x="1192" y="470" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="491" fill="#f4c781" font-size="13" font-weight="600">Vence em 18 dias</text><rect x="288" y="547" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="580" fill="#f3f1fb" font-size="18" font-weight="600">Revisão de contrato</text><text x="310" y="610" fill="#aeb1c8" font-size="14" font-weight="400">Validade: 20 nov 2026 · Categoria: Pessoal</text><rect x="1192" y="574" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="595" fill="#f4c781" font-size="13" font-weight="600">Vence em 23 dias</text><rect x="288" y="651" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="684" fill="#f3f1fb" font-size="18" font-weight="600">Comprovante de endereço</text><text x="310" y="714" fill="#aeb1c8" font-size="14" font-weight="400">Sem data de validade · Categoria: Casa</text><rect x="1192" y="678" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="699" fill="#a986ff" font-size="13" font-weight="600">Sem validade</text><rect x="288" y="797" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="826" fill="#a986ff" font-size="15" font-weight="650">Organização local, sem promessa de cofre</text><text x="308" y="856" fill="#aeb1c8" font-size="14" font-weight="400">As datas aparecem no Hub. Não há garantia de alerta com o aplicativo fechado ou proteção criptográfica.</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N6-T1</text></g></svg>