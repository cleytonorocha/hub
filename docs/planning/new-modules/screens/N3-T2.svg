<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N3-T2 — Configure uma rotina realista</title><desc id="desc">Escolha dias da semana e uma intenção simples para o seu hábito. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><rect x="14" y="249" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="281" fill="#a986ff" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#d8c7ff" font-size="13" font-weight="650">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N3-T2 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N3 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Configure uma rotina realista</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Escolha dias da semana e uma intenção simples para o seu hábito.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 2 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="209" width="1104" height="558" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="253" fill="#aeb1c8" font-size="14" font-weight="550">Nome do hábito</text><rect x="316" y="265" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="297" fill="#f3f1fb" font-size="16" font-weight="400">Ler por 15 minutos</text><text x="316" y="366" fill="#aeb1c8" font-size="14" font-weight="550">Dias previstos</text><rect x="316" y="389" width="68" height="49" rx="9" fill="#a986ff" stroke="#292c43"/><text x="330" y="419" fill="#171025" font-size="13" font-weight="650">SEG</text><rect x="399" y="389" width="68" height="49" rx="9" fill="#171b2e" stroke="#292c43"/><text x="413" y="419" fill="#aeb1c8" font-size="13" font-weight="650">TER</text><rect x="482" y="389" width="68" height="49" rx="9" fill="#a986ff" stroke="#292c43"/><text x="496" y="419" fill="#171025" font-size="13" font-weight="650">QUA</text><rect x="565" y="389" width="68" height="49" rx="9" fill="#171b2e" stroke="#292c43"/><text x="579" y="419" fill="#aeb1c8" font-size="13" font-weight="650">QUI</text><rect x="648" y="389" width="68" height="49" rx="9" fill="#a986ff" stroke="#292c43"/><text x="662" y="419" fill="#171025" font-size="13" font-weight="650">SEX</text><rect x="731" y="389" width="68" height="49" rx="9" fill="#171b2e" stroke="#292c43"/><text x="745" y="419" fill="#aeb1c8" font-size="13" font-weight="650">SÁB</text><rect x="814" y="389" width="68" height="49" rx="9" fill="#171b2e" stroke="#292c43"/><text x="828" y="419" fill="#aeb1c8" font-size="13" font-weight="650">DOM</text><text x="316" y="492" fill="#aeb1c8" font-size="14" font-weight="550">Começar em</text><rect x="316" y="504" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="536" fill="#f3f1fb" font-size="16" font-weight="400">28 out 2026</text><text x="316" y="615" fill="#f3f1fb" font-size="20" font-weight="650">Toda segunda, quarta e sexta, a partir de 28 out 2026.</text><text x="316" y="663" fill="#aeb1c8" font-size="16" font-weight="400">Pausar preserva registros e deixa de prever dias a partir de hoje.</text><text x="316" y="725" fill="#aeb1c8" font-size="14" font-weight="400">Nenhuma tarefa é criada automaticamente. Sem alarme garantido fora do aplicativo.</text><rect x="288" y="818" width="144" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="848" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><rect x="1152" y="818" width="240" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1170" y="848" fill="#171025" font-size="15" font-weight="650">Criar hábito</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N3-T2</text></g></svg>