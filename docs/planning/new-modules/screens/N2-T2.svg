<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N2-T2 — Registre uma movimentação</title><desc id="desc">Informe um valor positivo e escolha se ele é receita ou despesa. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><rect x="14" y="190" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="222" fill="#a986ff" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#d8c7ff" font-size="13" font-weight="650">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N2-T2 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N2 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Registre uma movimentação</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Informe um valor positivo e escolha se ele é receita ou despesa.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 2 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="208" width="138" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="229" fill="#a986ff" font-size="13" font-weight="600">Despesa</text><rect x="441" y="208" width="130" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="454" y="229" fill="#a986ff" font-size="13" font-weight="600">Receita</text><rect x="288" y="269" width="1104" height="476" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="312" fill="#aeb1c8" font-size="14" font-weight="550">Descrição</text><rect x="316" y="324" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="356" fill="#f3f1fb" font-size="16" font-weight="400">Supermercado</text><text x="316" y="419" fill="#aeb1c8" font-size="14" font-weight="550">Valor em reais · até 2 casas decimais</text><rect x="316" y="431" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="463" fill="#f3f1fb" font-size="16" font-weight="400">250,00</text><text x="864" y="419" fill="#aeb1c8" font-size="14" font-weight="550">Data do lançamento</text><rect x="864" y="431" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="879" y="463" fill="#f3f1fb" font-size="16" font-weight="400">27 out 2026</text><text x="316" y="526" fill="#aeb1c8" font-size="14" font-weight="550">Categoria</text><rect x="316" y="538" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="570" fill="#f3f1fb" font-size="16" font-weight="400">Alimentação</text><text x="316" y="668" fill="#aeb1c8" font-size="17" font-weight="400">Exemplo: R$ 250,00 será incluído nas despesas de outubro.</text><rect x="288" y="773" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="802" fill="#a986ff" font-size="15" font-weight="650">Lançamento manual</text><text x="308" y="832" fill="#aeb1c8" font-size="14" font-weight="400">Valor maior que zero. Casas decimais extras devem ser corrigidas, sem arredondamento silencioso.</text><rect x="288" y="868" width="144" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="898" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><rect x="1142" y="868" width="250" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1160" y="898" fill="#171025" font-size="15" font-weight="650">Salvar lançamento</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N2-T2</text></g></svg>