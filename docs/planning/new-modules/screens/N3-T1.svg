<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N3-T1 — Pequenas ações, todos os dias</title><desc id="desc">Acompanhe a rotina de hoje sem transformar cada hábito em uma tarefa. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><rect x="14" y="249" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="281" fill="#a986ff" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#d8c7ff" font-size="13" font-weight="650">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N3-T1 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N3 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Pequenas ações, todos os dias</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Acompanhe a rotina de hoje sem transformar cada hábito em uma tarefa.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="215" fill="#aeb1c8" font-size="18" font-weight="400">Quarta-feira, 28 outubro</text><rect x="1162" y="199" width="230" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1180" y="229" fill="#171025" font-size="15" font-weight="650">+ Novo hábito</text><rect x="288" y="264" width="344" height="98" rx="12" fill="#111527" stroke="#292c43"/><text x="308" y="293" fill="#aeb1c8" font-size="14" font-weight="400">Previstos hoje</text><text x="308" y="333" fill="#f3f1fb" font-size="28" font-weight="650">3 hábitos</text><rect x="668" y="264" width="344" height="98" rx="12" fill="#111527" stroke="#292c43"/><text x="688" y="293" fill="#aeb1c8" font-size="14" font-weight="400">Concluídos hoje</text><text x="688" y="333" fill="#84dfbd" font-size="28" font-weight="650">1 de 3</text><rect x="1048" y="264" width="344" height="98" rx="12" fill="#111527" stroke="#292c43"/><text x="1068" y="293" fill="#aeb1c8" font-size="14" font-weight="400">O que falta</text><text x="1068" y="333" fill="#a986ff" font-size="28" font-weight="650">2 hábitos</text><rect x="288" y="404" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="437" fill="#f3f1fb" font-size="18" font-weight="600">Beber água ao acordar</text><text x="310" y="467" fill="#aeb1c8" font-size="14" font-weight="400">Todos os dias · Registro de hoje</text><rect x="1192" y="431" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="452" fill="#84dfbd" font-size="13" font-weight="600">Feito hoje</text><rect x="288" y="521" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="554" fill="#f3f1fb" font-size="18" font-weight="600">Ler por 15 minutos</text><text x="310" y="584" fill="#aeb1c8" font-size="14" font-weight="400">Seg, qua e sex · Ainda não registrado</text><rect x="1192" y="548" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="569" fill="#a986ff" font-size="13" font-weight="600">Marcar hoje</text><rect x="288" y="638" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="671" fill="#f3f1fb" font-size="18" font-weight="600">Caminhar no bairro</text><text x="310" y="701" fill="#aeb1c8" font-size="14" font-weight="400">Todos os dias · Ainda não registrado</text><rect x="1192" y="665" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="686" fill="#a986ff" font-size="13" font-weight="600">Marcar hoje</text><rect x="288" y="794" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="823" fill="#a986ff" font-size="15" font-weight="650">Uma marcação por hábito e por dia</text><text x="308" y="853" fill="#aeb1c8" font-size="14" font-weight="400">O histórico mostra dias previstos, feitos e não marcados. Não há punição por uma sequência interrompida.</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N3-T1</text></g></svg>