400">Nome do autor</text><text x="864" y="416" fill="#aeb1c8" font-size="14" font-weight="550">Etiquetas opcionais</text><rect x="864" y="428" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="879" y="460" fill="#f3f1fb" font-size="16" font-weight="400">Trabalho</text><text x="316" y="521" fill="#aeb1c8" font-size="14" font-weight="550">Link de referência · opcional</text><rect x="316" y="533" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="565" fill="#f3f1fb" font-size="16" font-weight="400">Sem link · livro físico</text><text x="316" y="626" fill="#aeb1c8" font-size="14" font-weight="550">Estado inicial</text><rect x="316" y="638" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="670" fill="#f3f1fb" font-size="16" font-weight="400">A ler</text><text x="316" y="732" fill="#aeb1c8" font-size="14" font-weight="400">O cadastro funciona sem internet e sem buscar metadados automaticamente.</text><rect x="288" y="818" width="144" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="848" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><rect x="1116" y="818" width="276" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1134" y="848" fill="#171025" font-size="15" font-weight="650">Adicionar à biblioteca</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N5-T2</text></g></svg>