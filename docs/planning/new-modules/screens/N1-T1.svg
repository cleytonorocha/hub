<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N1-T1 — Uma biblioteca das suas ideias</title><desc id="desc">Registre conhecimento que continua útil depois que a tarefa termina. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><rect x="14" y="131" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="163" fill="#a986ff" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#d8c7ff" font-size="13" font-weight="650">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N1-T1 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N1 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Uma biblioteca das suas ideias</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Registre conhecimento que continua útil depois que a tarefa termina.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="215" fill="#aeb1c8" font-size="14" font-weight="550">Buscar nas notas</text><rect x="288" y="227" width="823" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="303" y="259" fill="#f3f1fb" font-size="16" font-weight="400">Título ou trecho do conteúdo</text><rect x="1135" y="227" width="257" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1153" y="257" fill="#171025" font-size="15" font-weight="650">+ Nova nota</text><rect x="288" y="307" width="156" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="328" fill="#a986ff" font-size="13" font-weight="600">Todas as notas</text><rect x="458" y="307" width="114" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="471" y="328" fill="#a986ff" font-size="13" font-weight="600">Fixadas</text><rect x="586" y="307" width="151" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="599" y="328" fill="#a986ff" font-size="13" font-weight="600">Arquivadas</text><rect x="751" y="307" width="210" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="764" y="328" fill="#a986ff" font-size="13" font-weight="600">Etiqueta: Trabalho</text><text x="288" y="397" fill="#f3f1fb" font-size="24" font-weight="650">Suas notas</text><text x="1250" y="397" fill="#aeb1c8" font-size="15" font-weight="400">3 registros</text><rect x="288" y="428" width="344" height="295" rx="12" fill="#111527" stroke="#292c43"/><rect x="310" y="452" width="124" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="323" y="473" fill="#a986ff" font-size="13" font-weight="600">Trabalho</text><text x="310" y="523" fill="#f3f1fb" font-size="19" font-weight="650">Decisões do projeto</text><text x="310" y="566" fill="#aeb1c8" font-size="15" font-weight="400">Contexto, alternativas e próximos p</text><text x="310" y="592" fill="#aeb1c8" font-size="15" font-weight="400">assos.</text><text x="310" y="680" fill="#aeb1c8" font-size="13" font-weight="400">Atualizada em 28 out, 10:40</text><rect x="668" y="428" width="344" height="295" rx="12" fill="#111527" stroke="#292c43"/><rect x="690" y="452" width="124" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="703" y="473" fill="#a986ff" font-size="13" font-weight="600">Pessoal</text><text x="690" y="523" fill="#f3f1fb" font-size="19" font-weight="650">Ideias para o fim de semana</text><text x="690" y="566" fill="#aeb1c8" font-size="15" font-weight="400">Museu, caminhada e lugares para con</text><text x="690" y="592" fill="#aeb1c8" font-size="15" font-weight="400">hecer.</text><text x="690" y="680" fill="#aeb1c8" font-size="13" font-weight="400">Atualizada em 27 out, 19:15</text><rect x="1048" y="428" width="344" height="295" rx="12" fill="#111527" stroke="#292c43"/><rect x="1070" y="452" width="124" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1083" y="473" fill="#a986ff" font-size="13" font-weight="600">Pessoal</text><text x="1070" y="523" fill="#f3f1fb" font-size="19" font-weight="650">Referências de estudo</text><text x="1070" y="566" fill="#aeb1c8" font-size="15" font-weight="400">Anotações e links para revisitar de</text><text x="1070" y="592" fill="#aeb1c8" font-size="15" font-weight="400">pois.</text><text x="1070" y="680" fill="#aeb1c8" font-size="13" font-weight="400">Atualizada em 26 out, 08:30</text><rect x="288" y="777" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="806" fill="#a986ff" font-size="15" font-weight="650">Ideias e tarefas têm papéis diferentes</text><text x="308" y="836" fill="#aeb1c8" font-size="14" font-weight="400">Uma nota guarda contexto; a associação com uma tarefa é opcional e explícita.</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N1-T1</text></g></svg>