<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N5-T3 — Acompanhe o que ficou da leitura</title><desc id="desc">Progresso registrado manualmente e uma nota para levar com você. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><rect x="14" y="367" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="399" fill="#a986ff" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#d8c7ff" font-size="13" font-weight="650">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N5-T3 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N5 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Acompanhe o que ficou da leitura</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Progresso registrado manualmente e uma nota para levar com você.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 3 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="204" width="248" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="225" fill="#a986ff" font-size="13" font-weight="600">Livro · Em andamento</text><text x="288" y="282" fill="#f3f1fb" font-size="29" font-weight="650">Design de produtos digitais</text><text x="288" y="322" fill="#aeb1c8" font-size="16" font-weight="400">Nome do autor · Etiqueta: Trabalho · Livro sem link</text><rect x="288" y="360" width="534" height="358" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="405" fill="#f3f1fb" font-size="22" font-weight="650">Onde você parou</text><text x="316" y="465" fill="#aeb1c8" font-size="14" font-weight="550">Marcador de progresso</text><rect x="316" y="477" width="478" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="509" fill="#f3f1fb" font-size="16" font-weight="400">Capítulo 3, página 72</text><text x="316" y="578" fill="#aeb1c8" font-size="17" font-weight="400">Um marcador textual, sem percentual</text><text x="316" y="611" fill="#aeb1c8" font-size="17" font-weight="400">ou duração de consumo presumidos.</text><rect x="316" y="647" width="240" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="334" y="677" fill="#171025" font-size="15" font-weight="650">Salvar marcador</text><rect x="850" y="360" width="542" height="358" rx="12" fill="#111527" stroke="#292c43"/><text x="878" y="405" fill="#f3f1fb" font-size="22" font-weight="650">Nota sobre o conteúdo</text><text x="878" y="453" fill="#aeb1c8" font-size="17" font-weight="400">Uma ideia para lembrar:</text><text x="878" y="492" fill="#f3f1fb" font-size="19" font-weight="400">Começar pelo problema antes de</text><text x="878" y="524" fill="#f3f1fb" font-size="19" font-weight="400">escolher a solução.</text><rect x="878" y="579" width="180" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="896" y="609" fill="#f3f1fb" font-size="15" font-weight="650">Editar nota</text><text x="878" y="686" fill="#aeb1c8" font-size="14" font-weight="400">Se houver link: abrir fora do Hub.</text><rect x="288" y="772" width="282" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="306" y="802" fill="#171025" font-size="15" font-weight="650">Marcar como concluído</text><rect x="592" y="772" width="220" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="610" y="802" fill="#f3f1fb" font-size="15" font-weight="650">Arquivar registro</text><rect x="288" y="838" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="867" fill="#a986ff" font-size="15" font-weight="650">Você decide quando terminou</text><text x="308" y="897" fill="#aeb1c8" font-size="14" font-weight="400">Arquivar preserva as notas. O progresso não altera tarefas nem depende de um leitor externo.</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N5-T3</text></g></svg>