<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Biblioteca de leitura — capas e catálogo de autores</title>
  <desc id="desc">Proposta visual: filtro de autor e cartão com capa e autor em destaque; edição de livro com link de imagem do Google Books e modal para cadastrar autor.</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b4d8d"/><stop offset=".52" stop-color="#302348"/><stop offset="1" stop-color="#131426"/></linearGradient>
    <linearGradient id="coverGlow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6ba8b" stop-opacity=".85"/><stop offset="1" stop-color="#b477c3" stop-opacity=".06"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1800" height="1120" fill="#090c19"/>
  <text x="40" y="50" fill="#a986ff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">HUB · BIBLIOTECA DE LEITURA</text>
  <text x="40" y="88" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="650">Proposta de experiência · autores e capas</text>
  <text x="1710" y="83" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="end">N5 · etapa complementar</text>

  <!-- Catalog view -->
  <g transform="translate(32 118)">
    <rect width="850" height="958" rx="18" fill="#0d1121" stroke="#292c43"/>
    <text x="28" y="42" fill="#a986ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">TELA 1 · FILA E FILTRO</text>
    <text x="28" y="92" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Sua próxima boa leitura</text>
    <text x="28" y="121" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="14">Encontre seus livros pelo título ou autor.</text>
    <rect x="662" y="62" width="160" height="46" rx="9" fill="#a986ff"/>
    <text x="742" y="91" fill="#171025" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="middle">+ Adicionar livro</text>
    <rect x="28" y="153" width="300" height="48" rx="8" fill="#0a0e1d" stroke="#343850"/>
    <text x="44" y="183" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="13">Buscar título, autor ou nota</text>
    <rect x="340" y="153" width="150" height="48" rx="8" fill="#0a0e1d" stroke="#343850"/>
    <text x="356" y="183" fill="#b8bad0" font-family="Segoe UI,Arial,sans-serif" font-size="13">Todos os tipos ▾</text>
    <rect x="502" y="153" width="188" height="48" rx="8" fill="#0a0e1d" stroke="#8f6ac5"/>
    <text x="518" y="175" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="10">AUTOR</text>
    <text x="518" y="191" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="13">Ivan Turguêniev ▾</text>
    <rect x="702" y="153" width="120" height="48" rx="8" fill="#171b2e" stroke="#343850"/>
    <text x="762" y="182" fill="#d8c7ff" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Pesquisar</text>
    <text x="28" y="244" fill="#b8bad0" font-family="Segoe UI,Arial,sans-serif" font-size="13">1–3 de 3 livros</text>

    <!-- featured book card -->
    <rect x="28" y="268" width="794" height="285" rx="14" fill="#111527" stroke="#554075"/>
    <rect x="46" y="286" width="190" height="249" rx="9" fill="url(#cover)"/>
    <path d="M64 307h154v206H64z" fill="none" stroke="url(#coverGlow)" stroke-width="1.5"/>
    <circle cx="141" cy="370" r="40" fill="#dcbd96" fill-opacity=".12"/>
    <path d="M99 413c17-28 66-33 86 0v45H99z" fill="#d6b6d5" fill-opacity=".22"/>
    <path d="M83 477h116" stroke="#e8c89e" stroke-opacity=".6"/>
    <text x="141" y="497" fill="#f0d5b7" font-family="Georgia,serif" font-size="9" letter-spacing="1.1" text-anchor="middle">DIÁRIO DE UM</text>
    <text x="141" y="510" fill="#f0d5b7" font-family="Georgia,serif" font-size="9" letter-spacing="1.1" text-anchor="middle">HOMEM SUPÉRFLUO</text>
    <text x="264" y="306" fill="#d8c7ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVRO · EM ANDAMENTO</text>
    <text x="264" y="347" fill="#f3f1fb" font-family="Georgia,serif" font-size="24" font-weight="700">Diário de um homem</text>
    <text x="264" y="376" fill="#f3f1fb" font-family="Georgia,serif" font-size="24" font-weight="700">supérfluo</text>
    <text x="264" y="414" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1">AUTOR</text>
    <text x="264" y="440" fill="#e5d6ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Ivan Turguêniev</text>
    <rect x="264" y="458" width="132" height="27" rx="14" fill="#342449" stroke="#76599c"/>
    <text x="330" y="476" fill="#e0caff" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">Literatura russa</text>
    <text x="264" y="512" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="12">42 de 160 páginas</text>
    <rect x="264" y="522" width="500" height="5" rx="3" fill="#34364d"/>
    <rect x="264" y="522" width="131" height="5" rx="3" fill="#b994ff"/>
    <text x="788" y="512" fill="#cdb8f3" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">26%</text>

    <rect x="28" y="573" width="794" height="208" rx="14" fill="#111527" stroke="#292c43"/>
    <rect x="46" y="591" width="126" height="172" rx="8" fill="#241e3c"/>
    <text x="109" y="683" fill="#c9a7e7" font-family="Georgia,serif" font-size="37" text-anchor="middle">✦</text>
    <text x="196" y="618" fill="#d8c7ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">LIVRO · A LER</text>
    <text x="196" y="654" fill="#f3f1fb" font-family="Georgia,serif" font-size="20" font-weight="700">Memórias do subsolo</text>
    <text x="196" y="688" fill="#e5d6ff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">Fiódor Dostoiévski</text>
    <rect x="196" y="706" width="151" height="26" rx="13" fill="#342449"/>
    <text x="271" y="724" fill="#e0caff" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">Literatura russa</text>
    <text x="788" y="747" fill="#bd9dff" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">Abrir registro ›</text>
    <rect x="28" y="801" width="794" height="1" fill="#292c43"/>
    <text x="28" y="835" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="12">Autor vinculado funciona como filtro e etiqueta; origem da publicação continua opcional.</text>
    <text x="28" y="875" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="12">As capas exibidas são cópias locais no volume do Hub.</text>
    <text x="28" y="929" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="11">Proposta visual estática · conteúdo de demonstração</text>
  </g>

  <!-- Edit book + author management modal -->
  <g transform="translate(916 118)">
    <rect width="852" height="958" rx="18" fill="#0d1121" stroke="#292c43"/>
    <text x="28" y="42" fill="#a986ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">TELA 2 · IMAGEM E AUTOR</text>
    <rect x="27" y="68" width="798" height="858" rx="14" fill="#111527" stroke="#343850"/>
    <text x="58" y="117" fill="#a986ff" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">EDITAR LIVRO</text>
    <text x="58" y="155" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Diário de um homem supérfluo</text>
    <rect x="58" y="179" width="194" height="282" rx="10" fill="url(#cover)"/>
    <circle cx="155" cy="262" r="43" fill="#dcbd96" fill-opacity=".12"/>
    <path d="M108 316c19-31 77-35 94 0v65h-94z" fill="#d6b6d5" fill-opacity=".22"/>
    <path d="M85 413h140" stroke="#e8c89e" stroke-opacity=".6"/>
    <text x="155" y="434" fill="#f0d5b7" font-family="Georgia,serif" font-size="10" text-anchor="middle">CAPA GUARDADA NO HUB</text>
    <text x="284" y="207" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Imagem da capa · link do Google Books</text>
    <rect x="284" y="222" width="502" height="48" rx="8" fill="#090d1c" stroke="#8062a4"/>
    <text x="301" y="251" fill="#d7c4ff" font-family="Segoe UI,Arial,sans-serif" font-size="12">https://books.google.com/books/content?id=…</text>
    <rect x="284" y="283" width="181" height="43" rx="8" fill="#a986ff"/>
    <text x="374" y="310" fill="#171025" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle">Carregar e guardar capa</text>
    <rect x="476" y="283" width="159" height="43" rx="8" fill="#171b2e" stroke="#343850"/>
    <text x="555" y="310" fill="#e5d6ff" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Enviar arquivo</text>
    <text x="284" y="352" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="11">A imagem será validada e salva localmente no Hub.</text>
    <rect x="58" y="489" width="728" height="1" fill="#292c43"/>
    <text x="58" y="527" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Autor(es)</text>
    <rect x="58" y="542" width="550" height="48" rx="8" fill="#090d1c" stroke="#343850"/>
    <rect x="72" y="552" width="151" height="27" rx="14" fill="#342449" stroke="#76599c"/>
    <text x="147" y="571" fill="#e0caff" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">Ivan Turguêniev ×</text>
    <text x="581" y="572" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="end">⌄</text>
    <rect x="622" y="542" width="164" height="48" rx="8" fill="#171b2e" stroke="#8f6ac5"/>
    <text x="704" y="571" fill="#d8c7ff" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">+ Novo autor</text>
    <text x="58" y="613" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="11">Selecione um autor do catálogo; é possível associar mais de um.</text>
    <text x="58" y="666" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Título</text>
    <rect x="58" y="680" width="728" height="47" rx="8" fill="#090d1c" stroke="#343850"/>
    <text x="74" y="709" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="13">Diário de um homem supérfluo</text>
    <text x="58" y="766" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Origem da edição · opcional</text>
    <rect x="58" y="780" width="728" height="47" rx="8" fill="#090d1c" stroke="#343850"/>
    <text x="74" y="809" fill="#858ba6" font-family="Segoe UI,Arial,sans-serif" font-size="13">Editora ou edição</text>
    <text x="58" y="859" fill="#9fa3ba" font-family="Segoe UI,Arial,sans-serif" font-size="11">Autor é um cadastro reutilizável; origem continua separada.</text>
    <rect x="523" y="866" width="121" height="43" rx="8" fill="#171b2e" stroke="#343850"/>
    <text x="583" y="893" fill="#eeeaf8" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Cancelar</text>
    <rect x="654" y="866" width="132" height="43" rx="8" fill="#a986ff"/>
    <text x="720" y="893" fill="#171025" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle">Salvar livro</text>

    <!-- author creation dialog as a compact overlay state -->
    <rect x="0" y="0" width="852" height="958" rx="18" fill="#050711" fill-opacity=".56"/>
    <g filter="url(#shadow)">
      <rect x="205" y="344" width="442" height="282" rx="14" fill="#171b2e" stroke="#9773c4" stroke-width="1.4"/>
      <text x="233" y="383" fill="#a986ff" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">CATÁLOGO DE AUTORES</text>
      <text x="233" y="419" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Cadastrar autor</text>
      <text x="233" y="457" fill="#aeb1c8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Nome de exibição</text>
      <rect x="233" y="470" width="386" height="48" rx="8" fill="#090d1c" stroke="#8062a4"/>
      <text x="249" y="500" fill="#f3f1fb" font-family="Segoe UI,Arial,sans-serif" font-size="13">Ivan Turguêniev</text>
      <text x="233" y="545" fill="#9fa3ba" font-family="Segoe UI,Arial,sans-serif" font-size="11">O autor ficará disponível para outros livros.</text>
      <rect x="362" y="563" width="118" height="42" rx="8" fill="#24283d" stroke="#444860"/>
      <text x="421" y="589" fill="#e6e4ef" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Cancelar</text>
      <rect x="491" y="563" width="128" height="42" rx="8" fill="#a986ff"/>
      <text x="555" y="589" fill="#171025" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle">Salvar autor</text>
    </g>
  </g>
</svg>
