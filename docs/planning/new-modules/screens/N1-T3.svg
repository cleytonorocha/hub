<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N1-T3 — Conhecimento que se conecta</title><desc id="desc">Consulte o conteúdo e associe uma tarefa sem duplicar a nota. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><rect x="14" y="131" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="163" fill="#a986ff" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#d8c7ff" font-size="13" font-weight="650">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N1-T3 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N1 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Conhecimento que se conecta</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Consulte o conteúdo e associe uma tarefa sem duplicar a nota.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 3 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="206" width="120" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="227" fill="#a986ff" font-size="13" font-weight="600">Trabalho</text><rect x="422" y="206" width="112" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="435" y="227" fill="#a986ff" font-size="13" font-weight="600">Projeto</text><text x="288" y="280" fill="#f3f1fb" font-size="29" font-weight="650">Decisões do projeto</text><text x="288" y="318" fill="#aeb1c8" font-size="14" font-weight="400">Atualizada em 28 out 2026, 10:40</text><rect x="288" y="353" width="726" height="402" rx="12" fill="#111527" stroke="#292c43"/><text x="315" y="396" fill="#f3f1fb" font-size="22" font-weight="650">Objetivo</text><text x="315" y="439" fill="#f3f1fb" font-size="18" font-weight="400">Centralizar decisões que precisam ser</text><text x="315" y="470" fill="#f3f1fb" font-size="18" font-weight="400">consultadas depois.</text><text x="315" y="536" fill="#f3f1fb" font-size="22" font-weight="650">Próximos passos</text><text x="315" y="579" fill="#f3f1fb" font-size="18" font-weight="400">Comparar alternativas e registrar o motivo</text><text x="315" y="610" fill="#f3f1fb" font-size="18" font-weight="400">da escolha.</text><text x="315" y="702" fill="#a986ff" font-size="16" font-weight="600">Abrir referência externa ↗</text><rect x="1038" y="353" width="354" height="402" rx="12" fill="#111527" stroke="#292c43"/><text x="1062" y="396" fill="#f3f1fb" font-size="20" font-weight="650">Tarefa associada</text><text x="1062" y="443" fill="#f3f1fb" font-size="16" font-weight="400">Revisar proposta de projeto</text><text x="1062" y="474" fill="#aeb1c8" font-size="14" font-weight="400">30 out · Pendente</text><rect x="1062" y="516" width="306" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="1080" y="546" fill="#f3f1fb" font-size="15" font-weight="650">Abrir tarefa</text><rect x="1062" y="583" width="306" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1080" y="613" fill="#171025" font-size="15" font-weight="650">Trocar tarefa relacionada</text><text x="1062" y="691" fill="#aeb1c8" font-size="14" font-weight="400">Remover vínculo não apaga</text><text x="1062" y="716" fill="#aeb1c8" font-size="14" font-weight="400">a nota nem a tarefa.</text><rect x="288" y="800" width="180" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="306" y="830" fill="#171025" font-size="15" font-weight="650">Editar nota</text><rect x="488" y="800" width="188" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="506" y="830" fill="#f3f1fb" font-size="15" font-weight="650">Arquivar nota</text><rect x="696" y="800" width="160" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="714" y="830" fill="#f3f1fb" font-size="15" font-weight="650">Fixar nota</text><text x="288" y="895" fill="#aeb1c8" font-size="14" font-weight="400">Voltar à biblioteca preserva sua busca. Arquivar mantém o conteúdo.</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N1-T3</text></g></svg>