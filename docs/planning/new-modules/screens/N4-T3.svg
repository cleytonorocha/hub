rar a proposta do projeto</text><text x="316" y="493" fill="#aeb1c8" font-size="16" font-weight="400">28 out 2026 · 14:00 — 14:12 · Encerrada manualmente</text><text x="316" y="544" fill="#aeb1c8" font-size="14" font-weight="550">Reflexão opcional</text><rect x="316" y="556" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="588" fill="#f3f1fb" font-size="16" font-weight="400">Retomar a comparação das alternativas.</text><text x="316" y="661" fill="#aeb1c8" font-size="16" font-weight="400">A tarefa “Revisar proposta de projeto” continua pendente.</text><rect x="288" y="741" width="210" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="306" y="771" fill="#171025" font-size="15" font-weight="650">Salvar reflexão</text><rect x="520" y="741" width="280" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="538" y="771" fill="#f3f1fb" font-size="15" font-weight="650">Ver todo o histórico</text><rect x="288" y="826" width="1104" height="86" rx="12" fill="#111527" stroke="#292c43"/><text x="310" y="859" fill="#f3f1fb" font-size="18" font-weight="600">Sessão anterior: estudar referências</text><text x="310" y="889" fill="#aeb1c8" font-size="14" font-weight="400">27 out · Planejado: 25 min · Registrado: 25 min</text><rect x="1192" y="853" width="178" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1205" y="874" fill="#84dfbd" font-size="13" font-weight="600">Finalizada</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N4-T3</text></g></svg>