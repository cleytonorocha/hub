<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N6-T3 — Prepare a renovação</title><desc id="desc">Revise uma tarefa para se organizar. A validade do documento não muda. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><rect x="14" y="426" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="458" fill="#a986ff" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#d8c7ff" font-size="13" font-weight="650">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N6-T3 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N6 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Prepare a renovação</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Revise uma tarefa para se organizar. A validade do documento não muda.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 3 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="204" width="278" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="301" y="225" fill="#f4c781" font-size="13" font-weight="600">Válido · vence em 18 dias</text><text x="288" y="281" fill="#f3f1fb" font-size="30" font-weight="650">Seguro residencial</text><rect x="288" y="324" width="534" height="405" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="368" fill="#f3f1fb" font-size="22" font-weight="650">Documento atual</text><text x="316" y="416" fill="#f3f1fb" font-size="17" font-weight="400">Categoria: Casa</text><text x="316" y="455" fill="#f3f1fb" font-size="17" font-weight="400">Validade: 15 nov 2026</text><text x="316" y="506" fill="#aeb1c8" font-size="17" font-weight="400">Conferir condições antes de renovar.</text><text x="316" y="558" fill="#aeb1c8" font-size="15" font-weight="400">Anexo: nenhum arquivo</text><rect x="316" y="632" width="205" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="334" y="662" fill="#f3f1fb" font-size="15" font-weight="650">Editar cadastro</text><rect x="850" y="324" width="542" height="405" rx="12" fill="#111527" stroke="#292c43"/><text x="878" y="368" fill="#f3f1fb" font-size="22" font-weight="650">Criar tarefa de renovação</text><text x="878" y="420" fill="#aeb1c8" font-size="14" font-weight="550">Título da nova tarefa</text><rect x="878" y="432" width="486" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="893" y="464" fill="#f3f1fb" font-size="16" font-weight="400">Revisar seguro residencial</text><text x="878" y="524" fill="#aeb1c8" font-size="14" font-weight="550">Data escolhida para a tarefa</text><rect x="878" y="536" width="486" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="893" y="568" fill="#f3f1fb" font-size="16" font-weight="400">10 nov 2026</text><text x="878" y="625" fill="#aeb1c8" font-size="15" font-weight="400">A validade continua em 15 nov 2026.</text><rect x="878" y="657" width="320" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="896" y="687" fill="#171025" font-size="15" font-weight="650">Confirmar criação da tarefa</text><rect x="288" y="788" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="817" fill="#a986ff" font-size="15" font-weight="650">Criar tarefa não renova o documento</text><text x="308" y="847" fill="#aeb1c8" font-size="14" font-weight="400">Depois de criar, mostre o vínculo. Concluir a tarefa não altera data, anexo ou conteúdo do documento.</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N6-T3</text></g></svg>