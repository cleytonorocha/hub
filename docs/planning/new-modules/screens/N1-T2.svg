<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N1-T2 — Dê forma à sua nota</title><desc id="desc">Um editor simples, com salvamento explícito e conteúdo local. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><rect x="14" y="131" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="163" fill="#a986ff" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#d8c7ff" font-size="13" font-weight="650">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><text x="31" y="340" fill="#aeb1c8" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#aeb1c8" font-size="13" font-weight="400">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N1-T2 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N1 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Dê forma à sua nota</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Um editor simples, com salvamento explícito e conteúdo local.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 2 / 3</text><path d="M288 169h1104" stroke="#292c43"/><text x="288" y="215" fill="#a986ff" font-size="16" font-weight="600">‹ Voltar à biblioteca</text><text x="288" y="262" fill="#aeb1c8" font-size="14" font-weight="550">Título</text><rect x="288" y="274" width="1104" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="303" y="306" fill="#f3f1fb" font-size="16" font-weight="400">Decisões do projeto</text><text x="288" y="367" fill="#aeb1c8" font-size="14" font-weight="550">Etiquetas opcionais</text><rect x="288" y="379" width="520" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="303" y="411" fill="#f3f1fb" font-size="16" font-weight="400">Trabalho, Projeto</text><text x="848" y="367" fill="#aeb1c8" font-size="14" font-weight="550">Tarefa relacionada · opcional</text><rect x="848" y="379" width="544" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="863" y="411" fill="#f3f1fb" font-size="16" font-weight="400">Revisar proposta de projeto</text><text x="288" y="476" fill="#aeb1c8" font-size="14" font-weight="550">Conteúdo</text><rect x="288" y="493" width="1104" height="250" rx="10" fill="#0b1020" stroke="#292c43"/><text x="311" y="533" fill="#f3f1fb" font-size="21" font-weight="650">Objetivo</text><text x="311" y="573" fill="#f3f1fb" font-size="17" font-weight="400">Centralizar as decisões que precisamos consultar depois.</text><text x="311" y="623" fill="#f3f1fb" font-size="21" font-weight="650">Próximos passos</text><text x="311" y="662" fill="#f3f1fb" font-size="17" font-weight="400">Comparar alternativas e registrar o motivo da escolha.</text><text x="311" y="712" fill="#aeb1c8" font-size="14" font-weight="400">Texto simples · sem arquivos ou captura automática de páginas</text><rect x="288" y="766" width="1104" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="308" y="795" fill="#a986ff" font-size="15" font-weight="650">Alterações ainda não salvas</text><text x="308" y="825" fill="#aeb1c8" font-size="14" font-weight="400">Ao sair, ofereça continuar editando ou descartar. Uma falha deve preservar a entrada.</text><rect x="288" y="868" width="144" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="898" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><rect x="1162" y="868" width="230" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1180" y="898" fill="#171025" font-size="15" font-weight="650">Salvar nota</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N1-T2</text></g></svg>