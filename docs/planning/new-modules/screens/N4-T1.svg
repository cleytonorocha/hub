<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">N4-T1 — Abra espaço para se concentrar</title><desc id="desc">Uma sessão local com começo, duração e encerramento claros. Proposta estática com dados fictícios.</desc><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#090c19" stroke="#090c19"/><rect x="0" y="0" width="244" height="1000" rx="0" fill="#0b0e1f" stroke="#292c43"/><text x="30" y="59" fill="#a986ff" font-size="31" font-weight="700">◆</text><text x="72" y="59" fill="#f3f1fb" font-size="24" font-weight="700">Hub</text><text x="26" y="109" fill="#aeb1c8" font-size="11" font-weight="650">SEUS ESPAÇOS</text><text x="31" y="163" fill="#aeb1c8" font-size="21" font-weight="400">▤</text><text x="65" y="161" fill="#aeb1c8" font-size="13" font-weight="400">Notas e conhecimento</text><text x="31" y="222" fill="#aeb1c8" font-size="21" font-weight="400">◈</text><text x="65" y="220" fill="#aeb1c8" font-size="13" font-weight="400">Finanças manuais</text><text x="31" y="281" fill="#aeb1c8" font-size="21" font-weight="400">✓</text><text x="65" y="279" fill="#aeb1c8" font-size="13" font-weight="400">Hábitos e rotinas</text><rect x="14" y="308" width="216" height="50" rx="10" fill="#211b37" stroke="#453261"/><text x="31" y="340" fill="#a986ff" font-size="21" font-weight="400">◷</text><text x="65" y="338" fill="#d8c7ff" font-size="13" font-weight="650">Sessões de foco</text><text x="31" y="399" fill="#aeb1c8" font-size="21" font-weight="400">▥</text><text x="65" y="397" fill="#aeb1c8" font-size="13" font-weight="400">Biblioteca de leitura</text><text x="31" y="458" fill="#aeb1c8" font-size="21" font-weight="400">◇</text><text x="65" y="456" fill="#aeb1c8" font-size="13" font-weight="400">Documentos e vencimentos</text><path d="M25 521h194" stroke="#292c43"/><text x="28" y="555" fill="#a986ff" font-size="11" font-weight="650">NOVA FUNCIONALIDADE</text><text x="28" y="582" fill="#aeb1c8" font-size="13" font-weight="400">Exploração de produto</text><text x="28" y="930" fill="#a986ff" font-size="11" font-weight="650">PROPOSTA ESTÁTICA</text><text x="28" y="956" fill="#aeb1c8" font-size="12" font-weight="400">N4-T1 · Dados de exemplo</text><text x="288" y="49" fill="#a986ff" font-size="12" font-weight="650">N4 / NOVOS MÓDULOS DO HUB</text><text x="288" y="102" fill="#f3f1fb" font-size="32" font-weight="700">Abra espaço para se concentrar</text><text x="288" y="138" fill="#aeb1c8" font-size="16" font-weight="400">Uma sessão local com começo, duração e encerramento claros.</text><rect x="1218" y="72" width="174" height="32" rx="16" fill="#211c38" stroke="#44365f"/><text x="1231" y="93" fill="#a986ff" font-size="13" font-weight="600">ETAPA 1 / 3</text><path d="M288 169h1104" stroke="#292c43"/><rect x="288" y="210" width="1104" height="560" rx="12" fill="#111527" stroke="#292c43"/><text x="316" y="256" fill="#aeb1c8" font-size="14" font-weight="550">Intenção da sessão</text><rect x="316" y="268" width="1048" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="300" fill="#f3f1fb" font-size="16" font-weight="400">Preparar a proposta do projeto</text><text x="316" y="367" fill="#aeb1c8" font-size="14" font-weight="550">Duração em minutos</text><rect x="316" y="379" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="331" y="411" fill="#f3f1fb" font-size="16" font-weight="400">25</text><text x="864" y="367" fill="#aeb1c8" font-size="14" font-weight="550">Tarefa associada opcional</text><rect x="864" y="379" width="500" height="50" rx="8" fill="#0b1020" stroke="#292c43"/><text x="879" y="411" fill="#f3f1fb" font-size="16" font-weight="400">Revisar proposta de projeto</text><text x="316" y="486" fill="#f3f1fb" font-size="24" font-weight="650">Um compromisso por vez</text><text x="316" y="530" fill="#aeb1c8" font-size="17" font-weight="400">Ao iniciar, você poderá acompanhar a contagem e encerrar antes do tempo.</text><text x="316" y="567" fill="#aeb1c8" font-size="17" font-weight="400">A sessão não conclui a tarefa associada automaticamente.</text><rect x="316" y="615" width="1048" height="84" rx="10" fill="#19182d" stroke="#3c3459"/><text x="336" y="644" fill="#a986ff" font-size="15" font-weight="650">Mantenha o Hub aberto</text><text x="336" y="674" fill="#aeb1c8" font-size="14" font-weight="400">Esta primeira versão não promete execução ou alertas com o aplicativo fechado.</text><rect x="288" y="817" width="144" height="48" rx="9" fill="#171b2e" stroke="#292c43"/><text x="306" y="847" fill="#f3f1fb" font-size="15" font-weight="650">Cancelar</text><rect x="1125" y="817" width="267" height="48" rx="9" fill="#a986ff" stroke="#a986ff"/><text x="1143" y="847" fill="#171025" font-size="15" font-weight="650">Iniciar 25 minutos</text><path d="M288 929h1104" stroke="#292c43"/><text x="288" y="960" fill="#aeb1c8" font-size="13" font-weight="400">Mockup estático • dados fictícios • não representa funcionalidade entregue</text><text x="1280" y="960" fill="#a986ff" font-size="13" font-weight="600">N4-T1</text></g></svg>